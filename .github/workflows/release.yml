name: Release desktop app

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release-tauri:
    name: Build ${{ matrix.label }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            platform: windows-latest
            args: ''
            rust-targets: ''
            dmg-asset-arch: ''
          - label: macOS Apple Silicon
            platform: macos-latest
            args: '--target aarch64-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
            dmg-asset-arch: aarch64
          - label: macOS Intel
            platform: macos-latest
            args: '--target x86_64-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
            dmg-asset-arch: x64
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        if: matrix.rust-targets == ''
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust stable with macOS targets
        if: matrix.rust-targets != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify before release
        run: |
          npm run check
          npm run verify:docs

      - name: Prepare Apple notarization key
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          set -euo pipefail
          if [[ -z "${APPLE_API_KEY}" || -z "${APPLE_API_KEY_CONTENT}" ]]; then
            echo "Apple notarization secrets are missing." >&2
            exit 1
          fi
          install -d -m 700 "$RUNNER_TEMP/apple-notary"
          key_path="$RUNNER_TEMP/apple-notary/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Build and upload signed Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
        with:
          tagName: v__VERSION__
          releaseName: '위드지니 셋업 v__VERSION__'
          releaseBody: |
            위드지니 셋업 공개 릴리즈입니다.

            - Windows: `.exe` 설치 파일을 내려받아 실행하세요.
            - macOS: `.dmg` 파일을 내려받아 Applications로 옮기세요.
            - 앱 내 업데이트 확인은 이 릴리즈의 서명된 `latest.json`을 사용합니다.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          assetNamePattern: 'withgenie-setup_[version]_[platform]_[arch][setup].[ext]'
          args: ${{ matrix.args }}

      - name: Notarize, staple, and replace macOS DMG asset
        if: runner.os == 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          dmg="$(find src-tauri/target -path '*/release/bundle/dmg/*.dmg' -type f | head -n 1)"
          if [[ -z "${dmg}" ]]; then
            echo "No DMG artifact found." >&2
            exit 1
          fi
          xcrun notarytool submit "$dmg" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl -a -vvv -t install "$dmg"
          asset_name="withgenie-setup_${version}_darwin_${{ matrix.dmg-asset-arch }}.dmg"
          renamed_dmg="$RUNNER_TEMP/$asset_name"
          cp "$dmg" "$renamed_dmg"
          gh release upload "$tag" "$renamed_dmg" --clobber --repo "$GITHUB_REPOSITORY"

  publish-release:
    name: Publish release
    needs: release-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Publish completed draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          gh release edit "v${version}" --draft=false --latest --repo "$GITHUB_REPOSITORY"
